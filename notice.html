<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | ANNAT SAHANI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #fff;
            line-height: 1.6;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
   NAVBAR
========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            padding: 22px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #080808;

            z-index: 20;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 28px;
            height: 30px;
        }

        .links>a,
        .dropbtn {
            color: #aaa;
            font-size: 14px;
            transition: .25s;
            white-space: nowrap;
        }

        .links>a:hover,
        .dropbtn:hover {
            color: #fff;
        }


        /* =========================
   MORE DROPDOWN
========================= */

        .dropdown {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .dropbtn {
            background: none;
            border: 0;
            padding: 0;
            margin: 0;
            cursor: pointer;
            font-family: inherit;
            line-height: normal;
        }

        .dropdown-content {
            display: none;

            position: absolute;
            right: 0;
            top: 30px;

            width: 205px;

            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;

            padding: 8px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, .5);

            padding-top: 8px;
        }

        .dropdown-content.open {
            display: block;
        }

        .dropdown-close {
            position: absolute;

            top: 0;
            right: 0;

            width: 32px;
            height: 32px;

            display: flex;

            justify-content: center;
            align-items: center;

            border: 0;
            border-left: 1px solid #292929;
            border-bottom: 1px solid #292929;
            border-radius: 0 11px 0 8px;

            background: none;

            color: #aaa;
            font-size: 14px;

            cursor: pointer;

            transition: .25s;
        }

        .dropdown-close:hover {
            background: #1b1b1b;
            color: #fff;
        }

        .dropdown-content a {
            display: block;

            padding: 11px 13px;

            border-radius: 8px;

            color: #aaa;
            font-size: 14px;

            white-space: nowrap;
        }

        .dropdown-content a:hover {
            background: #1b1b1b;
            color: #fff;
        }


        /* =========================
   NOTICE CONTENT
========================= */

        .notice {
            flex: 1;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 140px 20px 60px;

            background:
                radial-gradient(circle at center,
                    #191919 0%,
                    #080808 55%);
        }

        .icon {
            font-size: 40px;

            margin-bottom: 18px;
        }

        .notice h1 {
            font-size: clamp(28px, 6vw, 42px);

            letter-spacing: -1px;

            margin-bottom: 14px;
        }

        .notice p {
            color: #aaa;

            font-size: 15px;

            max-width: 420px;

            margin-bottom: 30px;
        }

        .button {
            display: inline-block;

            padding: 12px 22px;

            border: 1px solid #333;
            border-radius: 8px;

            font-size: 14px;

            transition: .25s;
        }

        .button:hover {
            background: #fff;
            color: #000;
        }


        /* =========================
   FOOTER
========================= */

        footer {
            padding: 30px 20px;

            text-align: center;

            color: #666;

            font-size: 12px;

            border-top: 1px solid #191919;
        }


        /* =========================
   MOBILE
========================= */

        @media(max-width:600px) {

            nav {
                height: 95px;

                padding: 17px 10px;

                display: block;

                text-align: center;
            }

            .logo {
                display: block;

                font-size: 17px;

                margin-bottom: 12px;

                height: 20px;
                line-height: 20px;
            }

            .links {
                display: flex;

                justify-content: center;

                align-items: center;

                gap: 17px;

                height: 30px;
            }

            .links>a,
            .dropbtn {
                font-size: 12px;

                line-height: 30px;

                height: 30px;
            }

            .dropdown {
                height: 30px;
            }

            .dropdown-content {
                top: 30px;
                right: -35px;
            }

            .notice {
                padding: 170px 8px 60px;
            }

        }


        /* =========================
   SMALL PHONES
========================= */

        @media(max-width:380px) {

            nav {
                height: 95px;
            }

        }
    </style>
</head>


<body>


    <!-- =========================
     NAVBAR
========================= -->

    <nav>

        <a href="index.html#home" class="logo">
            ANNAT SAHANI
        </a>

        <div class="links">

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#social">
                Social Media
            </a>

            <a href="index.html#contact">
                Contact
            </a>


            <div class="dropdown" id="moreDropdown">

                <button class="dropbtn" id="dropbtn" onclick="toggleDropdown(event)">
                    More
                </button>

                <div class="dropdown-content" id="dropdownContent">

                    <button class="dropdown-close" onclick="closeDropdown()">
                        ✕
                    </button>

                    <a href="notice.html">
                        Work With Me
                    </a>

                    <a href="notice.html">
                        Tools
                    </a>

                    <a href="notice.html">
                        Resources
                    </a>

                    <a href="notice.html">
                        My Achievements
                    </a>

                    <a href="notice.html">
                        Useful Links
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- =========================
     NOTICE CONTENT
========================= -->

    <div class="notice">

        <div class="icon">
            🚧
        </div>

        <h1>
            This page is coming soon
        </h1>

        <p>
            This section is currently being built and will be
            available shortly. Please check back later.
        </p>

        <a href="index.html#home" class="button">
            ← Back to Home
        </a>

    </div>



    <!-- =========================
     FOOTER
========================= -->

    <footer>

        © 2026 ANNAT SAHANI. All rights reserved.

    </footer>



    <script>

        // ===== Right-click disable =====
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        // ===== Block common DevTools / view-source shortcuts =====
        document.addEventListener("keydown", function (e) {
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.key.toLowerCase() === "u") ||
                (e.ctrlKey && e.key.toLowerCase() === "s") ||
                (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
            }
        });

        // ===== Console warning =====
        console.log("%cStop!", "color:red; font-size:40px; font-weight:bold;");
        console.log("%cThis is a developer feature. Copying this code without permission may violate copyright.", "font-size:14px;");


        function toggleDropdown(e) {

            e.stopPropagation();

            document
                .getElementById("dropdownContent")
                .classList
                .toggle("open");

        }


        function closeDropdown() {

            document
                .getElementById("dropdownContent")
                .classList
                .remove("open");

        }


        document.addEventListener("click", function (e) {

            const dropdown =
                document.getElementById("moreDropdown");

            if (
                dropdown &&
                !dropdown.contains(e.target)
            ) {

                closeDropdown();

            }

        });


        document.addEventListener("keydown", function (e) {

            if (e.key === "Escape") {

                closeDropdown();

            }

        });

    </script>


</body>

</html>
