<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ANNAT SAHANI</title>

    <link rel="stylesheet" href="notice-reset.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="dropdown.css">
    <link rel="stylesheet" href="notice-content.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="notice-mobile.css">
    <link rel="stylesheet" href="notice-mobile-small.css">
</head>


<body>


    <!-- =========================
     NAVBAR
========================= -->

    <nav>

        <a href="index.html#home" class="logo">
            ANNAT SAHANI
        </a>

        <div class="links">

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#social">
                Social Media
            </a>

            <a href="index.html#contact">
                Contact
            </a>


            <div class="dropdown" id="moreDropdown">

                <button class="dropbtn" id="dropbtn" onclick="toggleDropdown(event)">
                    More
                </button>

                <div class="dropdown-content" id="dropdownContent">

                    <button class="dropdown-close" onclick="closeDropdown()">
                        ✕
                    </button>

                    <a href="notice.html">
                        Work With Me
                    </a>

                    <a href="notice.html">
                        Tools
                    </a>

                    <a href="notice.html">
                        Resources
                    </a>

                    <a href="notice.html">
                        My Achievements
                    </a>

                    <a href="notice.html">
                        Useful Links
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- =========================
     404 CONTENT
========================= -->

    <div class="notice">

        <div class="icon">
            🔎
        </div>

        <h1>
            404 - Page Not Found
        </h1>

        <p>
            The page you're looking for doesn't exist. It may have
            been moved, renamed, or the URL might be mistyped.
        </p>

        <a href="index.html#home" class="button">
            ← Back to Home
        </a>

    </div>



    <!-- =========================
     FOOTER
========================= -->

    <footer>

        © 2026 ANNAT SAHANI. All rights reserved.

    </footer>



    <script>

        // ===== Right-click disable =====
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        // ===== Block common DevTools / view-source shortcuts =====
        document.addEventListener("keydown", function (e) {
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.key.toLowerCase() === "u") ||
                (e.ctrlKey && e.key.toLowerCase() === "s") ||
                (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
            }
        });


        function toggleDropdown(e) {

            e.stopPropagation();

            document
                .getElementById("dropdownContent")
                .classList
                .toggle("open");

        }


        function closeDropdown() {

            document
                .getElementById("dropdownContent")
                .classList
                .remove("open");

        }


        document.addEventListener("click", function (e) {

            const dropdown =
                document.getElementById("moreDropdown");

            if (
                dropdown &&
                !dropdown.contains(e.target)
            ) {

                closeDropdown();

            }

        });


        document.addEventListener("keydown", function (e) {

            if (e.key === "Escape") {

                closeDropdown();

            }

        });

    </script>


</body>

</html>
